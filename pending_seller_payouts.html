<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seller Payments - MyShop Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    body { background: #f6f7fa; font-family: 'Montserrat', Arial, Helvetica, sans-serif; margin: 0; padding-bottom: 40px;}
    .container { max-width: 1200px; margin: 24px auto; background: #fff; border-radius: 10px; box-shadow: 0 5px 30px #dadada; padding: 28px 36px 32px; }
    h1 { font-weight: 700; letter-spacing:1px; color:#232f3e; margin-bottom: 16px;text-align:center;}
    .date-filter { display:flex; justify-content:center; gap:12px; margin-bottom:24px; }
    .date-filter label { font-weight:600; font-size:1rem; align-self:center; }
    .date-filter input { padding:6px 10px; border-radius:5px; border:1px solid #ddd; font-size:1rem; }
    .load-btn { background:#0070f3; color:#fff; border:none; padding:8px 20px; border-radius:22px; font-weight:600; cursor:pointer; font-size:1rem; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 16px;}
    th, td { padding: 13px 10px; border-bottom: 1px solid #e4e7ea; text-align: center; font-size:1rem;}
    th { background: #f4f8fc; color: #313648; font-weight:700;}
    tr:last-child td { border-bottom: none; }
    .pay-status-paid { color: #078736; font-weight:600; }
    .pay-status-unpaid { color: #ff9800; font-weight:600;}
    .pay-btn { padding:8px 24px; background:#078736; color:#fff; border:none; border-radius:7px; font-weight:600; letter-spacing:0.5px; font-size:1rem; cursor:pointer;}
    .pay-btn:disabled { background: #d5d5d5; color: #aaa; cursor: not-allowed;}
    .pay-btn.processing { background:#f3b73a;color:#fff; }
    .invoice-btn {padding:8px 15px;background:#0070f3;color:#fff;border:none;border-radius:5px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:4px;}
    .invoice-btn:hover {background:#004fcc;}
    .spinner { display:inline-block; width: 21px; height: 21px; border: 3px solid #0070f3; border-radius: 50%; border-top: 3px solid #fff; animation: spin 1s linear infinite; vertical-align:middle;}
    @keyframes spin { 0%{ transform:rotate(0);} 100%{transform:rotate(360deg);} }
    .msg { text-align: center; margin: 18px 0 0 0; font-size:1.16rem;}
    #invoice-modal, #offline-pay-modal {
      display:none;
      position:fixed; top:8%; left:50%;
      transform:translateX(-50%);
      background:#fff;
      box-shadow:0 10px 30px #bbb;
      padding:32px 20px 14px 32px;
      border-radius:12px;
      max-width:450px;
      min-width:320px;
      z-index: 1000;
    }
    #offline-pay-modal {
      top: 10%;
      max-width: 420px;
      min-width: 300px;
      padding: 30px 24px 18px;
    }
    #offline-pay-modal form > div {
      margin-bottom: 14px;
    }
    #offline-pay-modal label {
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    #offline-pay-modal input[type="text"],
    #offline-pay-modal input[type="date"] {
      padding: 8px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    #offline-pay-modal .pay-btn {
      width: 100%;
      padding: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Seller Payments</h1>
  <div class="date-filter">
    <label for="from_date">From Date:</label>
    <input type="date" id="from_date" />
    <label for="to_date">To Date:</label>
    <input type="date" id="to_date" />
    <button class="load-btn" onclick="loadPayments()">Load Payouts</button>
  </div>
  <div id="payments-msg" class="msg"></div>

  <table>
    <thead>
    <tr>
      <th>Seller</th>
      <th>Bank</th>
      <th>IFSC</th>
      <th>Account</th>
      <th>Period</th>
      <th>Total Sales (₹)</th>
      <th>Commission (2%)</th>
      <th>GST (0%)</th>
      <th>Net Payable (₹)</th>
      <th>Customer Payment</th>
      <th>Status</th>
      <th>Pay</th>
      <th>Invoice</th>
    </tr>
    </thead>
    <tbody id="seller-payments"></tbody>
  </table>
</div>

<!-- Invoice Modal and Offline Payment Modal (unchanged) -->
<!-- ... Keep your previous modals & script code for invoice and offline payment ... -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = window.supabase.createClient(
    'https://wamqheltqmufuzrqlxlb.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhbXFoZWx0cW11ZnV6cnFseGxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwOTQxMzAsImV4cCI6MjA3NjY3MDEzMH0.xFtK5p22bHNzWcGXUgRUR5f-Q4SGdQperlPf4ItD2sY'
  );

  window.onload = () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('from_date').value = today;
    document.getElementById('to_date').value = today;
    loadPayments();
  };

  async function loadPayments() {
    const fromDateInput = document.getElementById('from_date').value;
    const toDateInput = document.getElementById('to_date').value;

    if (!fromDateInput || !toDateInput) {
      alert("Please select both From Date and To Date.");
      return;
    }

    const startDate = new Date(fromDateInput);
    const endDate = new Date(toDateInput);
    endDate.setHours(23, 59, 59, 999);

    if (startDate > endDate) {
      alert("From Date cannot be after To Date.");
      return;
    }

    document.getElementById("payments-msg").textContent = '';
    const tbody = document.getElementById('seller-payments');
    tbody.innerHTML = `<tr><td colspan="13"><span class="spinner"></span> Loading...</td></tr>`;

    try {
      const { data: payouts, error } = await supabase
        .rpc('get_pending_seller_payouts', {
          period_start: startDate.toISOString(),
          period_end: endDate.toISOString()
        });
      tbody.innerHTML = '';

      if (error) {
        document.getElementById('payments-msg').textContent = error.message;
        return;
      }
      if (!payouts || payouts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13">No payouts found for this period.</td></tr>`;
        return;
      }

      payouts.forEach(p => {
        const commission = p.total_sales * 0.02;
        const gst_on_commission = 0; // GST forced to zero as requested
        const netPay = p.total_sales - commission - gst_on_commission;
        const sellerLabel = `<strong>${p.seller_name}</strong><br/><small>${p.seller_id}</small>`;
        const statusHtml = p.status === "paid"
          ? `<span class="pay-status-paid">Paid</span>`
          : `<span class="pay-status-unpaid">Unpaid</span>`;
        const periodStr = `${fromDateInput} to ${toDateInput}`;
        const customerPayment = p.cod_paid
          ? `Paid Online ${p.cod_payment_status ? "("+p.cod_payment_status+")" : ""}`
          : "Not Paid";

        tbody.innerHTML += `
          <tr>
            <td>${sellerLabel}</td>
            <td>${p.bank_name || '-'}</td>
            <td>${p.ifsc_code || '-'}</td>
            <td>${p.bank_account || '-'}</td>
            <td>${periodStr}</td>
            <td>₹${p.total_sales.toFixed(2)}</td>
            <td>₹${commission.toFixed(2)}</td>
            <td>₹${gst_on_commission.toFixed(2)}</td>
            <td>₹${netPay.toFixed(2)}</td>
            <td>${customerPayment}</td>
            <td>${statusHtml}</td>
            <td>
              ${p.status !== "paid" ?
                `<button class="pay-btn" onclick="paySeller('${p.seller_id}', ${netPay.toFixed(2)}, this)">Online Pay</button>
                 <button class="invoice-btn" style="margin-top:6px;" onclick="openOfflinePayModal('${p.id}')">Mark Paid Offline</button>`
               : '-'
              }
            </td>
            <td>
              <button class="invoice-btn"
                onclick="generateInvoice('${p.seller_id}', '${p.seller_name}', '${p.bank_name}', '${p.bank_account}', '${p.ifsc_code}', ${p.total_sales}, ${commission}, ${gst_on_commission}, ${netPay}, '${periodStr}')">Invoice</button>
            </td>
          </tr>
        `;
      });
    } catch (err) {
      document.getElementById("payments-msg").textContent = err.message;
    }
  }

  // ... other functions for modals and pay logic (same as before) ...
</script>
</body>
</html>
